<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WhatsApp Bulk Sender</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        .container { max-width: 640px; margin: 0 auto; background: white; padding: 24px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        textarea, input { width: 100%; margin-bottom: 15px; padding: 10px; box-sizing: border-box; font-family: inherit; font-size: 14px; }
        button { background: #25D366; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; }
        button:disabled { background: #9fd9b8; cursor: not-allowed; }
        #qr-container { text-align: center; margin-bottom: 20px; }
        #qr-code { width: 200px; }

        .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .badge-sending { background: #fff3cd; color: #856404; }
        .badge-break { background: #d1ecf1; color: #0c5460; }
        .badge-idle { background: #e2e3e5; color: #383d41; }
        .badge-done { background: #d4edda; color: #155724; }

        #progress-section { display: none; margin-top: 10px; margin-bottom: 20px; }
        .progress-bar-outer { width: 100%; background: #eee; border-radius: 6px; overflow: hidden; height: 18px; margin: 8px 0; }
        .progress-bar-inner { height: 100%; background: #25D366; width: 0%; transition: width 0.4s ease; }
        .stats-row { display: flex; gap: 16px; font-size: 13px; color: #333; margin-bottom: 4px; flex-wrap: wrap; }
        .stats-row span b { color: #111; }

        #log-console { background: #1e1e1e; color: #d4d4d4; font-family: 'Courier New', monospace; font-size: 12px; height: 180px; overflow-y: auto; padding: 10px; border-radius: 6px; margin-top: 10px; white-space: pre-wrap; }

        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000; }
        .modal-box { background: white; padding: 30px; border-radius: 10px; max-width: 380px; width: 90%; text-align: center; }
        .modal-box h3 { margin-top: 0; color: #155724; }
        .modal-stats { text-align: left; margin: 16px 0; font-size: 14px; }
        .modal-stats div { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #eee; }
        .modal-box button { margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>WhatsApp Bulk Sender (Localhost)</h2>

    <div id="qr-container">
        <p id="status-text">Checking status...</p>
        <img id="qr-code" src="" style="display:none;" />
    </div>

    <div id="form-container" style="display:none;">
        <label>Mobile Numbers (Comma separated with Country Code):</label>
        <textarea id="numbers" rows="4" placeholder="8801700000000, 8801800000000"></textarea>

        <label>Message:</label>
        <textarea id="message" rows="4" placeholder="Write your message here..."></textarea>

        <button id="send-btn" onclick="sendBulk()">Send Messages</button>

        <div id="progress-section">
            <div class="stats-row">
                <span id="job-badge" class="badge badge-idle">Idle</span>
                <span>Batch: <b id="batch-info">-</b></span>
            </div>
            <div class="progress-bar-outer">
                <div class="progress-bar-inner" id="progress-bar-inner"></div>
            </div>
            <div class="stats-row">
                <span>Total: <b id="stat-total">0</b></span>
                <span>Sent: <b id="stat-sent">0</b></span>
                <span>Failed: <b id="stat-failed">0</b></span>
                <span>Invalid: <b id="stat-invalid">0</b></span>
            </div>
            <div id="break-info" style="font-size:13px; color:#0c5460; display:none;"></div>
            <div id="log-console"></div>
        </div>
    </div>
</div>

<!-- Completion Modal -->
<div class="modal-overlay" id="completion-modal">
    <div class="modal-box">
        <h3>✅ Sending Completed Successfully!</h3>
        <div class="modal-stats">
            <div><span>Total numbers</span><span id="modal-total">0</span></div>
            <div><span>Sent</span><span id="modal-sent">0</span></div>
            <div><span>Failed</span><span id="modal-failed">0</span></div>
            <div><span>Invalid / not on WhatsApp</span><span id="modal-invalid">0</span></div>
        </div>
        <button onclick="closeModal()">Close</button>
    </div>
</div>

<script>
    let lastShownRunId = null;   // tracks which completed run we've already shown a modal for
    let lastLogCount = 0;

    async function checkStatus() {
        let data;
        try {
            const res = await fetch('/status');
            data = await res.json();
        } catch (e) {
            document.getElementById('status-text').innerText = 'Status: Could not reach server ⚠️';
            return;
        }

        const statusText = document.getElementById('status-text');
        const qrImg = document.getElementById('qr-code');
        const formContainer = document.getElementById('form-container');

        if (data.isReady) {
            statusText.innerText = 'Status: Connected ✅';
            qrImg.style.display = 'none';
            formContainer.style.display = 'block';
        } else if (data.qrCodeUrl) {
            statusText.innerText = 'Scan this QR Code with WhatsApp:';
            qrImg.src = data.qrCodeUrl;
            qrImg.style.display = 'block';
            formContainer.style.display = 'none';
        } else {
            statusText.innerText = 'Generating QR Code, please wait...';
            formContainer.style.display = 'none';
        }

        renderJobState(data.sendState);
    }

    function renderJobState(state) {
        if (!state || (!state.isSending && !state.finished && state.total === 0)) {
            document.getElementById('progress-section').style.display = 'none';
            document.getElementById('send-btn').disabled = false;
            return;
        }

        document.getElementById('progress-section').style.display = 'block';

        const badge = document.getElementById('job-badge');
        const sendBtn = document.getElementById('send-btn');

        if (state.isSending && state.onBreak) {
            badge.textContent = 'On Break';
            badge.className = 'badge badge-break';
            sendBtn.disabled = true;
        } else if (state.isSending) {
            badge.textContent = 'Sending';
            badge.className = 'badge badge-sending';
            sendBtn.disabled = true;
        } else if (state.finished) {
            badge.textContent = 'Done';
            badge.className = 'badge badge-done';
            sendBtn.disabled = false;
        } else {
            badge.textContent = 'Idle';
            badge.className = 'badge badge-idle';
            sendBtn.disabled = false;
        }

        document.getElementById('batch-info').innerText =
            state.currentBatchNumber
                ? `#${state.currentBatchNumber} (${state.currentBatchProgress}/${state.currentBatchSize})`
                : '-';

        const overallDone = state.sent + state.failed + state.invalid;
        const pct = state.total > 0 ? Math.round((overallDone / state.total) * 100) : 0;
        document.getElementById('progress-bar-inner').style.width = pct + '%';

        document.getElementById('stat-total').innerText = state.total;
        document.getElementById('stat-sent').innerText = state.sent;
        document.getElementById('stat-failed').innerText = state.failed;
        document.getElementById('stat-invalid').innerText = state.invalid;

        const breakInfo = document.getElementById('break-info');
        if (state.onBreak && state.breakEndsAt) {
            const remainingMs = state.breakEndsAt - Date.now();
            const remainingMin = Math.max(0, Math.ceil(remainingMs / 60000));
            breakInfo.style.display = 'block';
            breakInfo.innerText = `☕ On a long break — resuming in ~${remainingMin} minute(s).`;
        } else {
            breakInfo.style.display = 'none';
        }

        // Render logs (append-only, keep scrolled to bottom)
        if (state.logs && state.logs.length !== lastLogCount) {
            const logConsole = document.getElementById('log-console');
            logConsole.innerText = state.logs.map(l => `[${new Date(l.time).toLocaleTimeString()}] ${l.text}`).join('\n');
            logConsole.scrollTop = logConsole.scrollHeight;
            lastLogCount = state.logs.length;
        }

        // Show completion modal once per finished run (also works after a page reload/reopen)
        if (state.finished && state.summary && state.runId !== lastShownRunId) {
            lastShownRunId = state.runId;
            showModal(state.summary);
        }
    }

    function showModal(summary) {
        document.getElementById('modal-total').innerText = summary.total;
        document.getElementById('modal-sent').innerText = summary.sent;
        document.getElementById('modal-failed').innerText = summary.failed;
        document.getElementById('modal-invalid').innerText = summary.invalid;
        document.getElementById('completion-modal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('completion-modal').style.display = 'none';
    }

    async function sendBulk() {
        const numbers = document.getElementById('numbers').value;
        const message = document.getElementById('message').value;

        if (!numbers.trim() || !message.trim()) {
            alert('Please fill in both numbers and message.');
            return;
        }

        const res = await fetch('/send-bulk', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ numbers, message })
        });
        const data = await res.json();
        alert(data.message);
        checkStatus();
    }

    // Poll status every 3 seconds — this is also what lets the page
    // recover full progress if it's reopened mid-job or after completion.
    setInterval(checkStatus, 3000);
    checkStatus();
</script>

</body>
</html>
